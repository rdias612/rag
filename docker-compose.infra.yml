version: '3.8'

services:
  # =========================================================================
  # Infrastructure Only (Database + Adminer)
  # Use this for hybrid workflow: Docker for DB, local for App (run_app.py)
  # =========================================================================
  db:
    image: ankane/pgvector:latest
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-ragdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: rag-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
    driver: local
